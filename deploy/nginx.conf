# BollyFlix Stremio addon - Nginx reverse proxy
#
# Usage:
#   1. Point your domain's A record at this VPS
#   2. Place this file at /etc/nginx/sites-available/bollyflix
#      (replace bollyflix.example.com with your real domain)
#   3. ln -s /etc/nginx/sites-available/bollyflix /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. Obtain a Let's Encrypt cert:
#      certbot --nginx -d bollyflix.example.com
#      (certbot will auto-edit the 443 server block with cert paths)
#
# The addon runs in Docker on port 7000; nginx terminates TLS and
# proxies /catalog /meta /stream /manifest.json /configure etc.

# --- HTTP -> HTTPS redirect + certbot challenge ---
server {
    listen 80;
    listen [::]:80;
    server_name bollyflix.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS reverse proxy ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bollyflix.example.com;

    # Paths are updated automatically by: certbot --nginx -d bollyflix.example.com
    ssl_certificate     /etc/letsencrypt/live/bollyflix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bollyflix.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # --- streaming-friendly proxy settings ---
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;

    # allow huge media files, no buffering (byte-range seeking must pass through)
    client_max_body_size 0;
    proxy_buffering     off;
    proxy_request_buffering off;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    location / {
        proxy_pass http://127.0.0.1:7000;
    }
}
